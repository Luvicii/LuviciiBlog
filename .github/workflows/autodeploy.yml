name: Auto Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 照片墙缩略图正常情况下随仓库提交（构建期会自动跳过），
      # 只有忘记提交时才会走到这里临时装 ImageMagick 现场生成（ubuntu-24.04 runner 不带它）
      - name: Ensure ImageMagick if photo-wall thumbnails are missing
        run: |
          if ls themes/luvicii/source/img/wall/*.webp >/dev/null 2>&1; then
            echo "缩略图已在仓库中，跳过"
          else
            echo "缺少缩略图，安装 ImageMagick 让构建期自动生成"
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi

      - name: Generate and minify site
        run: |
          npx hexo clean
          npx hexo generate
          npx gulp min
          [ -f public/index.html ] || exit 1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAT }}
          external_repository: Luvicii/Luvicii.github.io
          publish_branch: main
          publish_dir: ./public
          commit_message: "Deploy: ${{ github.sha }}"
